<html lang="en">
<head>
<meta charset="utf-8">

<link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAAyklEQVR4AeySyw2DQAxENzmljxSR9JRLSuFCT1AEfXADzWGklSXLNizCh0UaLf7q7cCz3Px0gO5AyIHv/Ns8ivzXIYDIYm9vfoDacu+tIjP5HfDe+mif6gBtPLqYc9YeFYALrj7dAOt/KZQGxTpOrUfm3QBysFXcAdwOvIZ3oTT7Wcep9ci8G0AOtoo7QF4Hps/4gM5+a+yAtD15HdCIW+fDDsBOSIIgB8m8FYcBrIXRen4A2FqLN6xzeLfyrMszvwOSuHV8uQMW8A4AAP//IKBonQAAAAZJREFUAwBummJByw+uWwAAAABJRU5ErkJggg==">
<meta name="description" content="Cabin Fever: an 8-bit top-down survival game. Outlast a puking zombie until sunrise.">
<title>Cabin Fever</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="g" width="320" height="240" tabindex="0" aria-label="Cabin Fever game screen. Keyboard controlled."></canvas>

<div id="share" hidden>
  <div class="box">
    <img id="cardimg" alt="Cabin Fever high score card">
    <p class="hint">Right-click or long-press the image to save it, or copy it straight to your clipboard.</p>
    <div class="row">
      <button id="bcopy" type="button">Copy image</button>
      <button id="btext" type="button">Copy brag text</button>
      <button id="bclose" type="button">Close (Esc)</button>
    </div>
    <p id="smsg" class="msg" aria-live="polite"></p>
  </div>
</div>

<!-- Plain scripts sharing globals, so the game also runs straight from file:// with no build step.
     Order matters: helpers first, main.js last. -->
<script src="js/core.js"></script>
<script src="js/config.js"></script>
<script src="js/font.js"></script>
<script src="js/content.js"></script>
<script src="js/sprites.js"></script>
<script src="js/audio.js"></script>
<script src="js/scores.js"></script>
<script src="js/level-cabin.js"></script>
<script src="js/level-clearing.js"></script>
<script src="js/levels.js"></script>
<script src="js/state.js"></script>
<script src="js/physics.js"></script>
<script src="js/update.js"></script>
<script src="js/render-world.js"></script>
<script src="js/render-screens.js"></script>
<script src="js/share.js"></script>
<script src="js/input.js"></script>
<script src="js/main.js"></script>
</body>
</html>
